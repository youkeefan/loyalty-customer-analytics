
version: 2

sources:
  - name: loyalty_raw
    database: LOYALTY_DB
    schema: RAW
    tables:
      - name: customers
        description: "Raw customer records from the loyalty programme."
      - name: transactions
        description: "Raw loyalty transaction records."
      - name: points_ledger
        description: "Raw loyalty points ledger records."

models:
  - name: stg_customers
    description: "Cleaned and standardised customer records."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - not_null
          - unique

      - name: signup_date
        data_tests:
          - not_null

      - name: loyalty_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BRONZE', 'SILVER', 'GOLD', 'PLATINUM']

      - name: customer_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']
  
  - name: stg_transactions
    description: "Cleaned and standardised loyalty transactions."
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: transaction_date
        data_tests:
          - not_null

      - name: spend
        data_tests:
          - not_null

      - name: points_earned
        data_tests:
          - not_null


  - name: stg_points_ledger
    description: "Cleaned and standardised loyalty points ledger records."
    columns:
      - name: ledger_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: transaction_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_transactions')
                field: transaction_id

      - name: activity_date
        data_tests:
          - not_null

      - name: activity_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EARN', 'REDEEM']

      - name: points_change
        data_tests:
          - not_null

  - name: int_customer_loyalty_summary
    description: "Customer-level summary of spending and loyalty points."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique


  - name: dim_customers
    description: "Customer dimension table."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: fct_transactions
    description: "Transaction fact table at transaction-level grain."
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: transaction_date
        data_tests:
          - not_null

      - name: spend
        data_tests:
          - not_null

      - name: points_earned
        data_tests:
          - not_null
